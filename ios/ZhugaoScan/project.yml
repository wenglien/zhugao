name: ZhugaoScan
options:
  bundleIdPrefix: app.zhugao
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ZhugaoScan:
    type: application
    platform: iOS
    sources:
      - path: ZhugaoScan
    info:
      path: ZhugaoScan/Info.plist
      properties:
        CFBundleDisplayName: 築稿掃描
        CFBundleDevelopmentRegion: zh-Hant
        NSCameraUsageDescription: 需要使用相機與 LiDAR 掃描房間，產生平面圖。
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIRequiredDeviceCapabilities: [arkit]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.zhugao.scan
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        ENABLE_PREVIEWS: YES
